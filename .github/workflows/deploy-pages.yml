name: Deploy Static Archive to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'articles/**'
      - 'exports/**'
      - 'media/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Build Website Assets & Sitemaps
        run: |
          python scripts/build.py

      - name: Assemble GitHub Pages Static Bundle
        run: |
          mkdir -p _site
          cp -r website/* _site/
          cp -r articles _site/
          cp -r exports _site/
          cp -r media _site/
          mkdir -p _site/database
          cp database/archive.sqlite _site/database/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
