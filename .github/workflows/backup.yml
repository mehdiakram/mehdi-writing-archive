name: 3-2-1 Automated Disaster Recovery Backup

on:
  schedule:
    # Run every Sunday at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    name: Generate Cold Storage Backup Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Create Backup Package
        run: |
          python scripts/backup.py

      - name: Upload Backup Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mehdi-legacy-backup
          path: backups/*.zip
          retention-days: 90
