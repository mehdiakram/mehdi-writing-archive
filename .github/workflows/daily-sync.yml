name: Daily Synchronization

on:
  schedule:
    # 06:00 AM Bangladesh Time (UTC+6) is 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      sync_mode:
        description: 'Sync Mode'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - full

concurrency:
  group: sync-archive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Sync WordPress Sources
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Archive Synchronization
        env:
          SYNC_MODE: ${{ github.event.inputs.sync_mode || 'incremental' }}
        run: |
          python scripts/sync.py --mode $SYNC_MODE

      - name: Validate Archive Integrity
        run: |
          python scripts/validate.py

      - name: Build Static Website Data & Sitemaps
        run: |
          python scripts/build.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Mehdi Archive Automation"
          
          git add database/archive.sqlite articles/ exports/ media/ website/data/ website/sitemap.xml reports/
          
          if git diff --staged --quiet; then
            echo "No archive changes detected. Repository is up to date."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "Auto-sync: update archive [$TIMESTAMP] [skip ci]"
            git push origin main
          fi
